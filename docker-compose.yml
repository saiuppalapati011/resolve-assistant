version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: resolve_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve_secret
      POSTGRES_DB: resolve_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolve_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
